services:
  mechanus-server:
    image: mechanus:latest
    build:
      context: ..
      tags:
        - mechanus
      dockerfile: Dockerfile
    container_name: mechanus-server
    environment:
      # InMemory database configuration
      DATABASE_TYPE: memory
      LOG_LEVEL: debug
      LOG_FORMAT: text
      LOG_REPORT_CALLER: "true"
      # Inits for database
      INITIALIZE_ADMIN_USERNAME: admin
      INITIALIZE_ADMIN_PASSWORD: admin
      # Tests sign up their own users
      AUTH_SIGNUP_ENABLED: "true"
    command: ./mechanus server --log.level debug --log.format text --log.report-caller
    volumes:
      # The example battle map scene, see docs/configuration/battle-maps.md
      - ../docs/examples/battlemap/scenes:/app/.config/scenes:ro
      - ../docs/examples/battlemap/rooms:/app/.config/rooms:ro
      - ../docs/examples/battlemap/shared:/app/.config/shared:ro
    ports:
      - "8080:8080"
      - "8443:8443"
    restart: unless-stopped
    networks:
      - mechanus-public

networks:
  mechanus-public:
    driver: bridge
    # This network is attachable and accessible for development
    attachable: true
