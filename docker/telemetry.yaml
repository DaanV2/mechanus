services:
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000" # Grafana (http://localhost:3000/). User: admin, password: admin
      - "4040:4040" # Pyroscope endpoint
      - "4317:4317" # OpenTelemetry GRPC endpoint
      - "4318:4318" # OpenTelemetry HTTP endpoint
      - "9090:9090" # Prometheus endpoint
    volumes:
      - ./data:/data
      # Dashboards as code, see docs/configuration/opentelemetry.md
      - ./grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/mechanus.yaml:ro
      - ./grafana/dashboards:/otel-lgtm/mechanus-dashboards:ro
    networks:
      default:
        aliases:
          - jaeger
          - otel-collector
          - prometheus

networks:
  default:
    driver: bridge
