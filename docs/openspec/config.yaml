schema: spec-driven

# The OpenSpec root lives in docs/ (docs/openspec/), not the repo root.
# Run `openspec` from inside docs/, or use `just spec <recipe>` from the repo root.

context: |
  Mechanus is a local, LAN-only TTRPG game-room system: one Go server per game table drives
  browser screens (GM, players, TV / table), lights, music and custom devices from "scenes".
  One running instance serves exactly one room.
  Scene / room configuration is authored and read-only at runtime; everything that changes
  during play is scene state, saved per scene when a scene is loaded or exited.
  There is no rules engine and no dice: only generic game primitives.
  Until a GM role exists, "GM" actions are allowed for any logged-in user unless a spec says
  otherwise; admin-only actions need the `admin` role.
  Architecture docs in docs/architecture/ describe the how; specs describe observable behaviour.
  Proposals name the milestone (M0-M6) they belong to; the Milestones section of
  docs/openspec/README.md is the milestone index and must link every open change.
  Battle map layer kinds beyond image and entity layers (walls, lights, sound, ...) are added
  with the feature that needs them.

rules:
  proposal:
    - State the milestone (M0-M6) in the Why section.
    - Carry unresolved decisions into design.md Open Questions, never into specs.
  tasks:
    - Each task group lands its own tests (Ginkgo for server, Playwright for browser flows) and docs.
    - Include running the lint checks from CLAUDE.md for every part touched.

operations:
  archive:
    guidance:
      - When archiving, remove the change from the Milestones section of docs/openspec/README.md.
