# A small battle map to develop against, see docs/configuration/battle-maps.md and
# docs/configuration/scene-files.md
version: 1
id: example-tavern
name: Example tavern
description: A small battle map to develop against, see docs/configuration/battle-maps.md
entities:
  - { id: barkeep, kind: npc, name: Barkeep }
  - { id: hero, kind: player, name: Hero }
  - { id: spy, kind: enemy, name: Spy, hidden: true }
instructions:
  screens:
    table:
      view: battlemap
      asset: maps/tavern.map.json
      overlays: [{ kind: entities }]
variants:
  - id: night
    name: Night
    tags: { time_of_day: night }
    instructions:
      screens:
        table:
          view: battlemap
          asset: maps/tavern-night.map.json
          overlays: [{ kind: entities }]
