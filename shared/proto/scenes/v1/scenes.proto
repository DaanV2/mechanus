syntax = "proto3";
package scenes.v1;

option go_package = "github.com/DaanV2/mechanus/server/proto/scenes/v1;scenesv1";

// A service for the GM to control which scene the room plays
service SceneService {
  // List the scenes that can be activated
  rpc List(ListScenesRequest) returns (ListScenesResponse) {}
  // Activate a scene (or switch variant when the scene is already active); the room's devices follow
  rpc Activate(ActivateSceneRequest) returns (ActivateSceneResponse) {}
  // Switch the variant of the active scene
  rpc SetVariant(SetVariantRequest) returns (SetVariantResponse) {}
  // Get the active scene, if any
  rpc GetActive(GetActiveSceneRequest) returns (GetActiveSceneResponse) {}
  // Hide an entity of the active scene from the screens, or reveal it
  rpc SetEntityHidden(SetEntityHiddenRequest) returns (SetEntityHiddenResponse) {}
  // Add an entity to the active scene during play
  rpc SpawnEntity(SpawnEntityRequest) returns (SpawnEntityResponse) {}
  // Remove an entity from the active scene (defeated, fled, ...)
  rpc RemoveEntity(RemoveEntityRequest) returns (RemoveEntityResponse) {}
  // Move an entity of the active scene on the battle map
  rpc MoveEntity(MoveEntityRequest) returns (MoveEntityResponse) {}
  // Throw away what happened in a scene during play, so it starts again from its configuration.
  // The active scene is reset in place and the room's devices follow; another scene starts fresh on its next activation
  rpc Reset(ResetSceneRequest) returns (ResetSceneResponse) {}
}

message ListScenesRequest {}

message ListScenesResponse {
  repeated Scene scenes = 1;
}

message ActivateSceneRequest {
  string scene_id = 1; // The scene to activate
  string variant_id = 2; // Optional variant to switch to, empty for the saved or default variant
}

message ActivateSceneResponse {
  ActiveScene active = 1;
  repeated string device_errors = 2; // Devices that could not be instructed; the scene is active regardless
}

message SetVariantRequest {
  string variant_id = 1; // The variant to switch to, empty for the scene's default
}

message SetVariantResponse {
  ActiveScene active = 1;
  repeated string device_errors = 2; // Devices that could not be instructed; the variant is active regardless
}

message GetActiveSceneRequest {}

message GetActiveSceneResponse {
  optional ActiveScene active = 1; // Not set when no scene is active
}

// A scene as configured by the GM
message Scene {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated Variant variants = 4;
  string default_variant = 5; // Empty when the scene's base instructions are the default
}

// An alternative state of a scene (night, rain, combat, ...)
message Variant {
  string id = 1;
  string name = 2;
  map<string, string> tags = 3; // Free form classification, e.g. time_of_day: night
}

message ActiveScene {
  Scene scene = 1;
  string variant_id = 2; // Empty when the base instructions are active
  repeated Entity entities = 3; // Entities present in the scene, hidden ones included
}

message SetEntityHiddenRequest {
  string entity_id = 1;
  bool hidden = 2; // True hides the entity from the screens, false reveals it
}

message SetEntityHiddenResponse {
  ActiveScene active = 1;
  repeated string device_errors = 2; // Devices that could not be instructed; the change happened regardless
}

message SpawnEntityRequest {
  string entity_id = 1; // Unique within the scene
  EntityKind kind = 2;
  string name = 3;
  bool hidden = 4; // Spawn hidden from the screens
  optional Position position = 5; // Where to draw it on battle maps, unset to not draw it until it is moved
}

message SpawnEntityResponse {
  ActiveScene active = 1;
  repeated string device_errors = 2; // Devices that could not be instructed; the change happened regardless
}

message RemoveEntityRequest {
  string entity_id = 1;
}

message RemoveEntityResponse {
  ActiveScene active = 1;
  repeated string device_errors = 2; // Devices that could not be instructed; the change happened regardless
}

message MoveEntityRequest {
  string entity_id = 1;
  Position position = 2;
}

message MoveEntityResponse {
  ActiveScene active = 1;
  repeated string device_errors = 2; // Devices that could not be told; the change happened regardless
}

message ResetSceneRequest {
  string scene_id = 1; // The scene to reset, active or not
}

message ResetSceneResponse {
  optional ActiveScene active = 1; // The active scene after the reset, not set when no scene is active
  repeated string device_errors = 2; // Devices that could not be instructed; the scene was reset regardless
}

// EntityKind is the role an entity plays in a scene.
enum EntityKind {
  ENTITY_KIND_UNSPECIFIED = 0;
  ENTITY_KIND_PLAYER = 1;
  ENTITY_KIND_NPC = 2;
  ENTITY_KIND_ENEMY = 3;
  ENTITY_KIND_OBJECT = 4;
}

// An entity present in the active scene
message Entity {
  string id = 1;
  EntityKind kind = 2;
  string name = 3;
  bool hidden = 4; // Hidden from the screens
  optional Position position = 5; // Where it was moved to during play, unset when it stands where the battle map places it
}

// A position on a battle map, in grid units
message Position {
  double x = 1;
  double y = 2;
}
