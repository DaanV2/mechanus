syntax = "proto3";
package users.v1;

option go_package = "github.com/DaanV2/mechanus/server/proto/users/v1;usersv1";

service UserService {
  // Create a new account. Requires the admin role, unless open sign-up is enabled on the server
  rpc Create(CreateAccountRequest) returns (CreateAccountResponse) {}
  rpc Get(GetUserRequest) returns (GetUserResponse) {}
  // List all users, requires the admin role
  rpc List(ListUsersRequest) returns (ListUsersResponse) {}
  // Reset the password of a user to a new one, requires the admin role. Signs out all sessions of that user
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse) {}
  // Change the password of the logged in user, signs out all their other sessions
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse) {}
  // Replace the roles of a user, requires the admin role.
  // Existing access tokens keep the old roles until they are refreshed.
  rpc SetRoles(SetRolesRequest) returns (SetRolesResponse) {}
}

message CreateAccountRequest {
  // The username
  string username = 1;
  // The password
  string password = 2;
}

message CreateAccountResponse {
  User user = 1;
}

message GetUserRequest {
  string id = 1; // The users UUID to lookup
}

message GetUserResponse {
  User user = 1;
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated User users = 1;
}

message ResetPasswordRequest {
  string id = 1; // The UUID of the user whose password is reset
  string new_password = 2; // The new password
}

message ResetPasswordResponse {}

message ChangePasswordRequest {
  string current_password = 1; // The current password of the logged in user
  string new_password = 2; // The new password
}

message ChangePasswordResponse {}

message SetRolesRequest {
  string id = 1; // The UUID of the user whose roles are replaced
  repeated string roles = 2; // The new roles, eg: admin, operator, user, viewer
}

message SetRolesResponse {
  User user = 1;
}

message User {
  string id = 1; // The users UUID
  string name = 2; // The users name
  repeated string roles = 3; // The users roles, only filled in for admins or the user themselves
}
