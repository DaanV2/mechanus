name: 🎭 Integration tests
on:
  workflow_call:
  workflow_dispatch:
env:
  CI: "true"
  FORCE_COLOR: true

jobs:
  test:
    name: 🎭 Integration tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # One backend is enough here: the server's integration tests (server/tests/integration) cover
      # what differs per database, on sqlite and postgres. SQLite is the default in production.
      DB_BACKEND: sqlite
    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v7

      - name: ⚒️ Setup Node.js Environment
        uses: actions/setup-node@v7
        with:
          cache: npm
          cache-dependency-path: tests/package-lock.json
          node-version-file: tests/package.json

      - name: ⚒️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 📥 Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-image
          path: /tmp

      - name: 🐋 Load Docker image
        run: gunzip < /tmp/mechanus.tar.gz | docker load

      - name: ⚒️ Install dependencies
        working-directory: tests
        run: npm ci

      - name: 🐋 Start server
        working-directory: tests
        run: |
          make server

      - name: 🎭 Run Playwright tests
        working-directory: tests
        run: |
          npm run test

      - name: ✒️ export server logs
        if: ${{ !cancelled() }}
        working-directory: tests
        run: |
          make server-logs

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 5
