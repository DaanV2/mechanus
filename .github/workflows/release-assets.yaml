name: 🚚 Release assets

on:
  release:
    types: [released]

jobs:
  binaries:
    runs-on: ubuntu-latest
    name: 📦 Build & Upload Binaries
    permissions:
      contents: write # Upload archives to the release

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GoReleaser derives the version from tags

      - name: ⚒️ Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ./server/go.mod
          cache-dependency-path: ./server/go.sum

      - name: ⚒️ Setup Node.js Environment
        uses: actions/setup-node@v7
        with:
          cache: npm
          cache-dependency-path: client/package-lock.json
          node-version-file: client/package.json

      # Builds linux / windows / darwin × amd64 / arm64 (see .goreleaser.yaml) and uploads the
      # archives and checksums.txt to the existing release, keeping its notes.
      - name: 🛠️ Build and upload
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-push-docker:
    runs-on: ubuntu-latest
    name: 🐳 Build & Push Docker Image
    needs: binaries # both edit the release; run one after the other
    permissions:
      contents: write # For updating the release
      packages: write # Required for pushing to ghcr.io
      id-token: write # OIDC token if needed

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v7

      - name: ⚒️ Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: ⚒️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Building tags
        id: repo
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: 🛠️ Build and Push
        id: docker-build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=multi-arch
          cache-to: type=gha,mode=max,scope=multi-arch
          tags: |
            ${{ steps.repo.outputs.image }}:latest
            ${{ steps.repo.outputs.image }}:${{ github.sha }}
            ${{ steps.repo.outputs.image }}:${{ github.ref_name }}

      - name: 📌 Update Release Notes with Docker Image
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          append_body: true
          body: |
            ---
            🐳 **Docker image for this release** (linux/amd64 + linux/arm64):
            - `${{ steps.repo.outputs.image }}:${{ github.event.release.tag_name }}`
            - `${{ steps.repo.outputs.image }}:latest`

            📦 **Binaries**: download the archive for your platform below and see [installation](https://github.com/${{ github.repository }}/blob/main/docs/installation.md).
