# This is a basic workflow to help you get started with Actions
name: 🗄️ Server
env:
  FORCE_COLOR: true

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Platform-independent checks only need to run once, on Linux.
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v7

      - name: ⚒️ Setup Golang
        uses: actions/setup-go@v7
        with:
          go-version-file: ./server/go.mod
          cache-dependency-path: ./server/go.sum

      # The golangci-lint version pinned in go.mod, same as `just server lint`.
      - name: 🔍 Run linting
        working-directory: server
        run: go tool golangci-lint run

      - name: 📝 Reporting
        run: |
          echo "✅ Server lint" >> $GITHUB_STEP_SUMMARY

  vulncheck:
    name: 🛡️ Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v7

      - name: ⚒️ Setup Golang
        uses: actions/setup-go@v7
        with:
          go-version-file: ./server/go.mod
          cache-dependency-path: ./server/go.sum

      # Also covers the standard library, so a stale `go` directive in go.mod fails here.
      - name: 🛡️ Run govulncheck
        working-directory: server
        run: go tool govulncheck ./...

      - name: 📝 Reporting
        run: |
          echo "✅ Server vulnerabilities" >> $GITHUB_STEP_SUMMARY

  # Build, vet and test on every platform the binary is released for.
  build-test:
    name: 📋 Build & test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v7

      - name: ⚒️ Setup Golang
        uses: actions/setup-go@v7
        with:
          go-version-file: ./server/go.mod
          cache-dependency-path: ./server/go.sum

      - name: 🛠️ Build
        working-directory: server
        run: go build ./...

      - name: 🔎 Vet
        working-directory: server
        run: go vet ./...

      - name: 📋 Run Tests
        working-directory: server
        run: |
          go tool ginkgo run --output-dir reports --cover --covermode atomic -coverprofile=coverage.out ./...

      - name: 📝 Reporting
        run: |
          echo "✅ Server - ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
