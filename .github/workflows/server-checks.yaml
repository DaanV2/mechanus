# This is a basic workflow to help you get started with Actions
name: 🗄️ Server
env:
  FORCE_COLOR: true

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Platform-independent checks only need to run once, on Linux.
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v7

      - name: ⚒️ Setup Golang
        uses: actions/setup-go@v7
        with:
          go-version-file: ./server/go.mod
          cache-dependency-path: ./server/go.sum

      # The golangci-lint version pinned in go.mod, same as `just server lint`.
      - name: 🔍 Run linting
        working-directory: server
        run: go tool golangci-lint run

      # Also covers the standard library, so a stale `go` directive in go.mod fails here.
      - name: 🛡️ Run govulncheck
        if: ${{ !cancelled() }} # still report vulnerabilities when linting fails
        working-directory: server
        run: go tool govulncheck ./...

      - name: 📝 Reporting
        run: |
          echo "✅ Server lint" >> $GITHUB_STEP_SUMMARY

  # Build, vet and test on every platform the binary is released for.
  build-test:
    name: 📋 Build & test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v7

      - name: ⚒️ Setup Golang
        uses: actions/setup-go@v7
        with:
          go-version-file: ./server/go.mod
          cache-dependency-path: ./server/go.sum

      - name: 🛠️ Build
        working-directory: server
        run: go build ./...

      - name: 🔎 Vet
        working-directory: server
        run: go vet ./...

      - name: 📋 Run Tests
        working-directory: server
        run: |
          go tool ginkgo run --output-dir reports --cover --covermode atomic -coverprofile=coverage.out ./...

      - name: 📝 Reporting
        run: |
          echo "✅ Server - ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY

  # The integration tests (server/tests/integration) assert what gets stored in the database,
  # so they run against every supported backend. Linux only: service containers need Linux runners.
  integration:
    name: 🗃️ Integration tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        # An empty image skips the service for the other backends
        image: ${{ matrix.database == 'postgres' && 'postgres:18-alpine' || '' }}
        env:
          POSTGRES_USER: mechanus
          POSTGRES_PASSWORD: mechanus_test
          POSTGRES_DB: mechanus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mechanus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_TYPE: ${{ matrix.database }}
      # Test credentials only
      TEST_DATABASE_DSN: ${{ matrix.database == 'postgres' && 'host=localhost port=5432 user=mechanus password=mechanus_test dbname=mechanus_test sslmode=disable' || '' }}

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v7

      - name: ⚒️ Setup Golang
        uses: actions/setup-go@v7
        with:
          go-version-file: ./server/go.mod
          cache-dependency-path: ./server/go.sum

      - name: 🗃️ Run integration tests
        working-directory: server
        run: go tool ginkgo run ./tests/integration/...

      - name: 📝 Reporting
        run: |
          echo "✅ Server integration - ${{ matrix.database }}" >> $GITHUB_STEP_SUMMARY
